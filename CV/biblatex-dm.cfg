%% Custom biblatex datamodel overlay for the dahlkecv class.
%% biblatex auto-loads this file (if present on the search path) AFTER
%% the main style datamodel (apa.dbx), so it's the right place to ADD
%% fields without replacing the style's own datamodel.

\DeclareDatamodelFields[type=field,datatype=literal]{award,coverage}
\DeclareDatamodelEntryfields{award,coverage}
